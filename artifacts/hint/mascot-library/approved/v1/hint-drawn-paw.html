#hint-drawn-paw .hint-brand { font-size:12px; letter-spacing:.29em; color:#86717f; font-weight:500; margin-bottom:14px; }

#hint-drawn-paw .hint-stage { position:relative; width:100%; max-width:344px; aspect-ratio:1; display:grid; place-items:center; margin:8px auto 12px; }

#hint-drawn-paw .hint-shadow { position:absolute; width:92px; height:12px; bottom:12px; border-radius:50%; background:radial-gradient(ellipse,#927b8d22,transparent 72%); }
#hint-drawn-paw .hint-controls { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
#hint-drawn-paw button { font-family:inherit; font-size:14px; font-weight:500; min-height:44px; }
#hint-drawn-paw .hint-primary, #hint-drawn-paw .hint-secondary { border:0; padding:11px 20px; border-radius:999px; }
#hint-drawn-paw .hint-primary { background:#6c445f; color:#fff9f4; }
#hint-drawn-paw .hint-secondary { background:#eee7e9; color:#604b5a; }
#hint-drawn-paw details { max-width:300px; margin:16px auto 0; text-align:left; color:#796574; font-size:12px; }
#hint-drawn-paw summary { text-align:center; padding:10px; min-height:44px; }
#hint-drawn-paw .hint-timeline-label { display:flex; justify-content:space-between; gap:10px; margin:10px 0 0; }
#hint-drawn-paw input { width:100%; min-height:44px; accent-color:#6c445f; margin:0; }
#hint-drawn-paw .hint-status { font-size:12px; min-height:16px; margin:3px 0 0; }
@media(max-width:360px) { #hint-drawn-paw .hint-card { padding:25px 12px 12px; } #hint-drawn-paw h2 { font-size:29px; } }
