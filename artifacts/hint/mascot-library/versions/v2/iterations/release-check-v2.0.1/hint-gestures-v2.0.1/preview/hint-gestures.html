<div id="hint-expressive-gestures" class="viz-dotted-background" aria-label="Hint gesture collection">
  <section class="hint-studio">
    <div class="hint-wordmark">HINT</div>
    <p class="hint-version">Gesture collection · v2</p>
    <h2 data-title>Let me think…</h2>
    <div class="hint-stage">
      <span class="hint-shadow" aria-hidden="true"></span>
      <button class="hint-character cursor-interaction" type="button" aria-label="Play Hint’s gesture">
        <canvas width="768" height="768" role="img" aria-label="Hint, a cream star with rounded paws, a lilac scarf, and a sealed letter"></canvas>
      </button>
    </div>
    <label class="hint-label" for="hint-gesture-choice">Gesture</label>
    <select id="hint-gesture-choice" class="cursor-interaction" data-gesture>
      <option value="wink-left">Left wink</option>
      <option value="wink-right">Right wink</option>
      <option value="nod">Nod</option>
      <option value="listening">Listening</option>
      <option value="thinking">Thinking</option>
      <option value="celebration">Celebration</option>
      <option value="offer-letter">Offer a letter</option>
    </select>
    <div class="hint-actions">
      <button type="button" class="hint-primary cursor-interaction" data-play>Play gesture</button>
      <button type="button" class="hint-secondary cursor-interaction" data-pause>Pause</button>
    </div>
    <p class="hint-status" role="status" aria-live="polite" data-status></p>
    <details class="hint-inspect">
      <summary class="cursor-interaction">Inspect the movement</summary>
      <div class="hint-inspect-row"><label for="hint-gesture-time">Timeline</label><output data-time>0.00 s</output></div>
      <input id="hint-gesture-time" type="range" min="0" max="1900" step="1" value="0" data-timeline aria-label="Gesture timeline" class="cursor-interaction">
      <div class="hint-inspect-row"><label for="hint-gesture-speed">Playback</label><select id="hint-gesture-speed" data-speed class="cursor-interaction"><option value="1">Normal</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select></div>
      <div class="hint-inspect-row"><label for="hint-v2-size">Character size</label><select id="hint-v2-size" data-size class="cursor-interaction"><option value="344">App preview</option><option value="160">Small · 160 px</option><option value="96">Avatar · 96 px</option></select></div>
      <label class="hint-check cursor-interaction"><input type="checkbox" data-hide-labels>Hide gesture names</label>
      <label class="hint-check cursor-interaction"><input type="checkbox" data-accents checked>Show question mark and sparkles</label>
      <button type="button" class="hint-reset cursor-interaction" data-reset>Reset scene</button>
    </details>
  </section>
  <details class="hint-reference" data-v1-reference>
    <summary class="cursor-interaction">Compare with the v1 collection</summary>
    <iframe title="Hint gesture collection v1" data-v1></iframe>
    <p role="status" data-comparison-status></p>
  </details>
  <details class="hint-reference" data-reference>
    <summary class="cursor-interaction">Compare with the approved greeting</summary>
    <iframe title="Approved Hint greeting" data-approved></iframe>
  </details>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Hanken+Grotesk:wght@400;500&display=swap');
#hint-expressive-gestures { padding:20px 0; color:#51384a; font-family:'Hanken Grotesk',sans-serif; }
#hint-expressive-gestures * { box-sizing:border-box; }
#hint-expressive-gestures .hint-studio { max-width:430px; margin:0 auto; padding:28px 24px 12px; border:1px solid #e7dbe3; border-radius:30px; background:#faf7f2; text-align:center; }
#hint-expressive-gestures .hint-wordmark { font-size:12px; letter-spacing:.29em; color:#86717f; font-weight:500; margin-bottom:14px; }
#hint-expressive-gestures .hint-version { font-size:12px; color:#86717f; margin:-7px 0 14px; }
#hint-expressive-gestures h2 { font:400 31px/1.15 'Cormorant Garamond',serif; margin:0; min-height:36px; }
#hint-expressive-gestures .hint-stage { position:relative; width:100%; max-width:344px; aspect-ratio:1; display:grid; place-items:center; margin:6px auto 6px; }
#hint-expressive-gestures .hint-character { position:relative; z-index:1; border:0; background:transparent; border-radius:35%; width:min(100%,var(--hint-character-size,344px)); aspect-ratio:1; padding:0; }
#hint-expressive-gestures canvas { display:block; width:100%; height:auto; }
#hint-expressive-gestures .hint-shadow { position:absolute; width:min(92px,calc(var(--hint-character-size,344px) * .3)); height:12px; bottom:calc((100% - min(100%,var(--hint-character-size,344px))) / 2 + 12px); border-radius:50%; background:radial-gradient(ellipse,#927b8d22,transparent 72%); }
#hint-expressive-gestures .hint-label { display:block; text-align:left; font-size:12px; color:#796574; margin:4px 0 5px; }
#hint-expressive-gestures select { height:44px; min-height:44px; border:1px solid #e3d7df; background:#fffaf7; border-radius:12px; padding:10px 12px; color:#51384a; font:400 16px 'Hanken Grotesk',sans-serif; }
#hint-expressive-gestures [data-gesture] { width:100%; }
#hint-expressive-gestures .hint-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:13px; }
#hint-expressive-gestures button { font:500 14px 'Hanken Grotesk',sans-serif; min-height:44px; }
#hint-expressive-gestures .hint-primary,#hint-expressive-gestures .hint-secondary { border:0; padding:11px 20px; border-radius:999px; }
#hint-expressive-gestures .hint-primary { background:#6c445f; color:#fff9f4; min-width:142px; }
#hint-expressive-gestures .hint-secondary { background:#eee7e9; color:#604b5a; }
#hint-expressive-gestures button:disabled { opacity:.6; }
#hint-expressive-gestures select:disabled { opacity:.8; }
#hint-expressive-gestures .hint-status { min-height:18px; font-size:12px; color:#796574; margin:10px 0 0; }
#hint-expressive-gestures .hint-inspect { text-align:left; color:#796574; font-size:12px; }
#hint-expressive-gestures summary { text-align:center; padding:12px 4px; min-height:44px; font-size:12px; }
#hint-expressive-gestures .hint-inspect-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
#hint-expressive-gestures .hint-inspect-row { margin:6px 0; }
#hint-expressive-gestures .hint-check { display:flex; align-items:center; gap:10px; min-height:44px; }
#hint-expressive-gestures .hint-check input { width:18px; height:18px; min-height:18px; flex:none; }
#hint-expressive-gestures[data-labels-hidden="true"] [data-title] { visibility:hidden; }
#hint-expressive-gestures output { font-variant-numeric:tabular-nums; }
#hint-expressive-gestures input { display:block; width:100%; min-height:44px; accent-color:#6c445f; margin:0; }
#hint-expressive-gestures .hint-reset { display:block; margin:8px auto 0; border:0; background:transparent; color:#6c445f; padding:8px 14px; }
#hint-expressive-gestures .hint-reference { max-width:430px; margin:6px auto 0; color:#796574; }
#hint-expressive-gestures iframe { display:block; border:0; width:100%; height:750px; }
@media(max-width:360px) { #hint-expressive-gestures .hint-studio { padding:24px 14px 10px; } #hint-expressive-gestures h2 { font-size:28px; } }
</style>

const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
const ease = value => { const t = clamp(value); return t * t * t * (t * (t * 6 - 15) + 10); };

function curve(points, time) {
  if (!points?.length) return 0;
  if (time <= points[0][0]) return points[0][1];
  if (time >= points.at(-1)[0]) return points.at(-1)[1];
  let i = 0;
  while (points[i + 1][0] < time) i++;
  const slope = index => {
    if (index === 0 || index === points.length - 1) return 0;
    const h0 = points[index][0] - points[index - 1][0];
    const h1 = points[index + 1][0] - points[index][0];
    const a = (points[index][1] - points[index - 1][1]) / h0;
    const b = (points[index + 1][1] - points[index][1]) / h1;
    if (a * b <= 0) return 0;
    const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
    return (w1 + w2) / (w1 / a + w2 / b);
  };
  const h = points[i + 1][0] - points[i][0], u = (time - points[i][0]) / h;
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * points[i][1] + (u3 - 2 * u2 + u) * h * slope(i)
    + (-2 * u3 + 3 * u2) * points[i + 1][1] + (u3 - u2) * h * slope(i + 1);
}

function sampleGesture(id, time) {
  const clip = gestures[id];
  const pose = { x: 0, y: 0, roll: 0, head: 0, lean: 0, squash: 0, scale: 0, eyeLeft: 0, eyeRight: 0, gazeX: 0, gazeY: 0,
    thought:0,joy:0,attention:0,assurance:0,playful:0,playfulSide:0,expectant:0,
    pawThink:0,pawOpen:0,pawCelebrate:0,pawHug:0,pawDip:0,question:0,sparkles:0 };
  if (!clip) return { ...pose, engage: 0 };
  for (const [key, track] of Object.entries(clip.tracks)) pose[key] = curve(track, time);
  pose.engage = ease(time / .32) * (1 - ease((time - clip.duration + .5) / .5));
  if(id==='offer-letter')pose.engage=ease(time/.32);
  if(id==='deliver-letter')pose.engage=1-ease((time-2.1)/.5);
  return pose;
}

const letterKeys = {
  'offer-letter': [[0,0],[.3,0],[.95,1],[1.8,2],[2.2,2]],
  'deliver-letter': [[0,2],[.25,2],[.7,3],[1.6,4],[2.6,5]]
};

function sampleLetterPaws(geometry, id, time, letter) {
  const keys=letterKeys[id] || [[0,letter==='delivered'?5:0],[1,letter==='delivered'?5:0]];
  let index=0;while(index<keys.length-2&&keys[index+1][0]<time)index++;
  const u=clamp((time-keys[index][0])/(keys[index+1][0]-keys[index][0]));
  return ['left','right'].map(side=>{
    const poses=geometry[side],a=poses[keys[index][1]],b=poses[keys[index+1][1]];
    const interpolate=get=>curve(keys.map(([t,i])=>[t,get(poses[i])]),time);
    const spread=id==='deliver-letter'?curve([[0,0],[.25,0],[.7,6],[1.6,0],[2.6,0]],time)*(side==='left'?-1:1):0;
    return {side,a:keys[index][1],b:keys[index+1][1],mix:ease(u),
      center:[0,1].map(c=>interpolate(p=>p.center[c])+(c===0?spread:0)),
      points:a.points.map((_,j)=>[0,1].map(c=>interpolate(p=>p.points[j][c])+(c===0?spread:0))),
      uvA:a,uvB:b};
  });
}

function samplePaws(geometry,id,time,letter,expressionGeometry,pose=sampleGesture(id,time)) {
  const paws=sampleLetterPaws(geometry,id,time,letter);
  paws.forEach(p=>{p.textureA='letter-'+p.side+'-'+p.a;p.textureB='letter-'+p.side+'-'+p.b;});
  if(!expressionGeometry||id.includes('letter'))return paws;
  function blend(index,sourceIndex,weight,reflect=false,offset=[0,0]) {
    if(weight<=0)return;
    const p=paws[index],source=expressionGeometry.wave[sourceIndex],n=source.points.length;
    const uv=reflect?{center:source.center,points:source.points.map((_,j)=>source.points[(n/2-j+n)%n])}:source;
    const world=q=>[(reflect?410-q[0]:q[0])+offset[0],q[1]+offset[1]];
    const target={center:world(uv.center),points:uv.points.map(world)};
    p.center=p.center.map((v,c)=>v+(target.center[c]-v)*weight);
    p.points=p.points.map((q,j)=>q.map((v,c)=>v+(target.points[j][c]-v)*weight));
    p.uvB=uv;p.textureB='paw-'+sourceIndex;p.mix=ease(weight);
  }
  function connected(name,weight) {
    const drawing=expressionGeometry.connected?.[name];
    if(!drawing||weight<=0)return;
    const index=drawing.side==='right'?1:0,p=paws[index],arc=Math.sin(weight*Math.PI);

    p.points=p.points.map((q,j)=>q.map((v,c)=>position(v,c,drawing.points[j][c])));

  }

  connected('listening',pose.pawOpen);
  blend(0,2,pose.pawCelebrate);
  if(letter==='delivered'&&pose.pawCelebrate>0)blend(1,2,pose.pawCelebrate,true,[198,0]);
  for(const p of paws){
    const dx=(p.side==='left'?1:-1)*pose.pawHug*7;
    const dy=-pose.pawHug*5+pose.pawDip*(p.side==='left'?-3:2);
    p.center=[p.center[0]+dx,p.center[1]+dy];p.points=p.points.map(q=>[q[0]+dx,q[1]+dy]);
  }

}

function sampleEnvelope(id,time,letter) {
  let amount=0,release=0;
  if(id==='offer-letter')amount=curve([[0,0],[.3,0],[.95,.55],[1.8,1],[2.2,1]],time);

  if(state.gesture!=='deliver-letter'&&(state.active||state.time>0)&&selected!==state.gesture){selected=state.gesture;choice.value=selected;}
  const running = state.active && !state.paused;
  const waiting = state.letter === 'offered' && state.gesture === 'offer-letter' && state.time >= state.duration && !state.active;
  const reset = selected === 'offer-letter' && state.letter === 'delivered';
  title.textContent = waiting ? 'A letter for you.' : state.gesture === 'deliver-letter' ? 'This one is yours.' : gestures[selected].title;
  play.textContent = waiting ? 'Take the letter' : reset ? 'Reset letter' : running ? 'Playing…' : state.paused && (state.active || state.time > 0 && state.time < state.duration) ? 'Continue' : 'Play again';
  play.disabled = running;choice.disabled = state.active || waiting || (state.time > 0 && state.time < state.duration);
  character.setAttribute('aria-label', waiting ? 'Take Hint’s letter' : 'Play Hint’s gesture');
  pause.textContent = state.paused ? 'Resume' : 'Pause';
  timeline.max = Math.round(state.duration * 1000);timeline.value = Math.round(state.time * 1000);
  timeOutput.textContent = state.time.toFixed(2) + ' s';
  root.querySelector('.hint-shadow').style.transform = `translateX(${pose.x*150}px) scaleX(${1+pose.y*5})`;
  const message = waiting ? 'Tap to take your letter.' : reset ? 'Delivered.' : state.reducedMotion && !state.active ? 'Motion is paused. Play a gesture when you like.' : '';
  if (message !== lastStatus) { status.textContent = message;lastStatus = message; }
}

createHintMascot(canvas, { assets: assetBundle, onUpdate: update, onComplete: detail => {
  root.dispatchEvent(new CustomEvent('hint:gesture-complete',{detail}));persist();
} }).then(controller => {
  api = controller;
  root.mascot = api;
  if (!api.getState().reducedMotion && !saved?.paused) api.playGesture(selected);
  else api.pause();
  const activate = () => {
    const state = api.getState();
    if (state.letter === 'offered' && state.gesture === 'offer-letter' && state.time >= state.duration) api.acceptLetter();
    else if (selected === 'offer-letter' && state.letter === 'delivered') { api.resetScene();selected = 'offer-letter';choice.value = selected;api.playGesture(selected); }
    else if (state.paused && (state.active || state.time > 0 && state.time < state.duration)) api.resume();
    else api.playGesture(selected);
    persist();
  };
  play.addEventListener('click', activate);character.addEventListener('click', activate);
  choice.addEventListener('change', () => { selected = choice.value;api.playGesture(selected);persist(); });
  pause.addEventListener('click', () => { api.getState().paused ? api.resume() : api.pause();persist(); });
  timeline.addEventListener('input', () => api.seek(Number(timeline.value)/1000));
  timeline.addEventListener('change', persist);
  root.querySelector('[data-speed]').addEventListener('change', event => api.setSpeed(Number(event.target.value)));
  root.querySelector('[data-reset]').addEventListener('click', () => { api.resetScene();selected = 'thinking';choice.value = selected;update(api.getState(), api.getPose());persist(); });
  root.querySelector('[data-accents]').addEventListener('change',event=>api.setAccentsVisible(event.target.checked));
  root.querySelector('[data-hide-labels]').addEventListener('change',event=>{
    root.dataset.labelsHidden=String(event.target.checked);
    Array.from(choice.options).forEach((option,i)=>{option.textContent=event.target.checked?'Gesture '+String.fromCharCode(65+i):gestures[option.value].label;});
  });
  root.querySelector('[data-size]').addEventListener('change',event=>root.style.setProperty('--hint-character-size',event.target.value+'px'));
  window.addEventListener('openai:set_globals', event => {
    const data = event.detail?.globals?.widgetState?.privateContent;
    if (!data || data.version !== 'gesture-library-v2' || api.getState().active) return;
    if (gestures[data.gesture] && data.gesture !== 'deliver-letter') { selected = data.gesture;choice.value = selected; }
    if (data.paused) api.pause();update(api.getState(), api.getPose());
  });
}).catch(error => {
  canvas.style.backgroundImage = `url(${assetBundle.images['approved-rest']})`;
  canvas.style.backgroundSize = 'contain';
  status.textContent = 'The animation could not load.';console.error(error);
});

root.querySelector('[data-v1-reference]').addEventListener('toggle',async event=>{
  const frame=root.querySelector('[data-v1]');
  if(!event.target.open||frame.srcdoc||frame.dataset.loading)return;
  frame.dataset.loading='true';
  try{
    const bytes=Uint8Array.from(atob(collectionV1Gzip),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    frame.srcdoc=await new Response(stream).text();
    frame.addEventListener('load',()=>{
      const resize=()=>{frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';};
      resize();frame.contentDocument.fonts?.ready.then(resize);
    },{once:true});
  }catch(error){root.querySelector('[data-comparison-status]').textContent='The saved comparison could not load.';console.error(error);delete frame.dataset.loading;}
});

root.querySelector('[data-reference]').addEventListener('toggle', event => {
  const frame = root.querySelector('[data-approved]');
  if (event.target.open && !frame.srcdoc) {
    frame.srcdoc = '<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:transparent}</style>' + approvedGreeting;
    frame.addEventListener('load', () => {
      const resize = () => { frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px'; };
      resize();frame.contentDocument.fonts?.ready.then(resize);
    }, { once: true });
  }
});

})();
</script>
