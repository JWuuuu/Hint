<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e253c" />
    <script>
      // Apply the saved theme before the first paint so the page, Safari's bars and
      // the overscroll area match from the start. AppShell keeps it in sync afterwards.
      (function () {
        try {
          var bright = localStorage.getItem("hint-theme") === "bright";
          document.documentElement.dataset.hintTheme = bright ? "bright" : "dark";
          document.documentElement.classList.toggle("dark", !bright);
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hint" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
