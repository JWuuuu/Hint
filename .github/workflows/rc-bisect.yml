# Diagnosis only, never merged: which RC branch makes WebKit crash in the receipt matrix?
# Each variant reverts one branch's commits in the runner (nothing is pushed), builds,
# and runs only the receipt specs on iPhone SE.
name: RC bisect
on:
  push:
    branches: ['rc-bisect/**']
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rc
            revert: ''
          - variant: without-mascot-antialias
            revert: cd30fc5
          - variant: without-tester-invites
            revert: 04ec8fd
          - variant: without-menu-exit
            revert: cbccb8d ef1d3cc
    env:
      API_PROXY_TARGET: http://127.0.0.1:1
      HINT_E2E_PORT: '5188'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert ${{ matrix.variant }}
        if: ${{ matrix.revert != '' }}
        run: |
          for sha in ${{ matrix.revert }}; do
            git -c user.name=bisect -c user.email=bisect@example.invalid revert --no-edit "$sha"
          done
          git log --oneline -3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - run: pnpm --filter @workspace/hint exec playwright install --with-deps webkit
      - run: pnpm --filter @workspace/hint exec playwright test --config playwright.production.config.ts --project=iphone-se e2e/merge-visual-matrix.spec.ts e2e/merge-receipt.spec.ts
      - name: Summarize first attempts, retries and skips
        if: always()
        run: |
          node artifacts/hint/scripts/e2e-summary.mjs artifacts/hint/test-results/production-results.json "Receipt specs (${{ matrix.variant }})"
          echo "crashes: $(grep -rl 'Target crashed' artifacts/hint/test-results 2>/dev/null | wc -l)"
