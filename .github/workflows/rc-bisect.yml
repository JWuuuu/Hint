# Diagnosis only, never merged: what makes the motion-on receipt matrix hang or crash in WebKit?
# Round 2: the same build with one canvas hidden at a time, the four dark 200% cases
# repeated three times each without retries, and the runner's memory sampled.
name: RC bisect
on:
  push:
    branches: ['rc-bisect/**']
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: as-shipped
            hide: ''
          - variant: hide-mascot-canvas
            hide: '[data-testid="hint-guide-layer"] canvas'
          - variant: hide-constellation-canvas
            hide: '.hint-app-background canvas'
    env:
      API_PROXY_TARGET: http://127.0.0.1:1
      HINT_E2E_PORT: '5188'
      DIAG_HIDE: ${{ matrix.hide }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - run: pnpm --filter @workspace/hint exec playwright install --with-deps webkit
      - name: Receipt matrix, motion on, dark, 200% text, x3
        run: |
          (while true; do free -m | awk '/Mem:/{print $3}' >> /tmp/mem.txt; sleep 2; done) &
          pnpm --filter @workspace/hint exec playwright test --config playwright.production.config.ts --project=iphone-se --retries=0 --repeat-each=3 e2e/merge-visual-matrix.spec.ts -g "dark app=false system=false text=200" || true
          echo "peak used memory (MB): $(sort -n /tmp/mem.txt | tail -1), samples: $(wc -l < /tmp/mem.txt)"
      - name: Summarize
        if: always()
        run: |
          node artifacts/hint/scripts/e2e-summary.mjs artifacts/hint/test-results/production-results.json "Receipt dark 200% (${{ matrix.variant }})" || true
          echo "crash files: $(grep -rl 'Target crashed' artifacts/hint/test-results 2>/dev/null | wc -l)"
