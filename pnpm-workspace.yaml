# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), add a temporary allowlist entry
# only for packages from trusted maintainers, and remove it once the window has
# passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: 7.3.7
  wouter: ^3.3.5
  # 4.6.6 rejects oversized bounded collections before visiting their elements.
  zod: 4.6.6

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # Same-major parser security fixes for upstream's exact development-tool pins.
  # Keep these scoped to the reviewed parents; codegen and CSS builds cover them.
  "orval@8.22.0>js-yaml": "4.3.2"
  "@tailwindcss/typography@0.5.19>postcss-selector-parser": "6.1.5"
  # Exact-parent compatibility validated with generated SQL, API worker transports
  # and Windows traversal regressions. These are local compatibility declarations,
  # not upstream support claims; revisit when the parents adopt patched esbuild.
  "drizzle-kit@0.31.10>esbuild": "0.28.2"
  "esbuild-plugin-pino@2.3.3>esbuild": "0.28.2"
  # Preserve the accepted deprecated-loader replacement, scoped to its only parent.
  "drizzle-kit@0.31.10>@esbuild-kit/esm-loader": "npm:tsx@4.23.15"
  # Paired with the exact TypeDoc patch below to use minimatch's public partial API.
  # This local compatibility declaration requires review on parent updates.
  "typedoc@0.28.19>minimatch": "11.0.5"

patchedDependencies:
  "typedoc@0.28.19": "patches/typedoc@0.28.19.patch"

allowBuilds:
  esbuild: true
